<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Error</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23ef4444%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22></circle><line x1=%2212%22 y1=%228%22 x2=%2212%22 y2=%2212%22></line><line x1=%2212%22 y1=%2216%22 x2=%2212.01%22 y2=%2216%22></line></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

:root {
    --bg-color: #0a0a0a;
    --text-primary: #e5e5e5;
    --text-dim: #737373;
    --accent-error: #ef4444;
    --accent-system: #3b82f6;
}

body {
    font-family: 'JetBrains Mono', monospace;
    background-color: var(--bg-color);
    color: var(--text-primary);
}

.noise-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0.03;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    z-index: 0;
}

.cursor-blink {
    animation: blink 1s step-end infinite;
}
@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

.fade-in { animation: fadeIn 0.3s ease-out forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

<div class="noise-bg"></div>

<div class="max-w-2xl w-full z-10">

    <div class="mb-8 border-l-2 border-red-500 pl-6 fade-in">
        <h1 class="text-4xl font-bold tracking-tight mb-2">ERR_INTERNET_DISCONNECTED</h1>
        <p class="text-gray-500 text-lg">The host is unreachable.</p>
    </div>

    <div class="bg-neutral-900 rounded border border-neutral-800 p-6 font-mono text-sm shadow-2xl fade-in" style="animation-delay: 0.1s;">
        <div class="flex items-center gap-2 mb-4 border-b border-neutral-800 pb-2">
            <div class="w-3 h-3 rounded-full bg-neutral-700"></div>
            <div class="w-3 h-3 rounded-full bg-neutral-700"></div>
            <div class="w-3 h-3 rounded-full bg-neutral-700"></div>
            <span class="text-neutral-500 ml-2 text-xs">Terminal</span>
        </div>

        <div class="space-y-1 text-gray-400" id="terminal-output">
            <div><span class="text-blue-500">$</span> ping 65.108.253.3</div>
            <div id="ping-lines"></div>
            <div class="mt-2"><span class="text-blue-500">$</span> <span class="cursor-blink">_</span></div>
        </div>
    </div>

    <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6 fade-in" style="animation-delay: 0.2s;">
        <div class="space-y-3 text-sm text-gray-500">
            <p class="font-semibold text-gray-300">Diagnostics:</p>
            <ul class="list-disc list-inside space-y-1 marker:text-gray-600">
                <li>Check your network cable or Wi-Fi signal.</li>
                <li>Verify DNS configuration.</li>
                <li>Restart your router or modem.</li>
            </ul>
        </div>

        <div class="flex flex-col justify-end">
            <button onclick="window.location.reload()" class="group relative w-full bg-white text-black font-semibold py-3 px-4 rounded hover:bg-gray-200 transition-all duration-200 active:scale-[0.99]">
                <span>Reload Page</span>
                <div class="absolute inset-0 border border-white/20 rounded pointer-events-none"></div>
            </button>
            
        </div>
    </div>

</div>

<script>


const pingContainer = document.getElementById('ping-lines');
let count = 0;
const maxPings = 4;

function simulatePing() {
    if (count < maxPings) {
        const delay = Math.random() * 800 + 200; // 200-1000ms per line
        setTimeout(() => {
            const line = document.createElement('div');
            line.innerHTML = `<span class="text-red-400">Request timeout for icmp_seq ${count}</span>`;
            pingContainer.appendChild(line);
            count++;
            simulatePing();
        }, delay);
    } else {
        const lossLine = document.createElement('div');
        lossLine.innerHTML = `<span class="text-yellow-500">--- 65.108.253.3 ping statistics ---<br>${maxPings} packets transmitted, 0 received, 100% packet loss</span>`;
        pingContainer.appendChild(lossLine);
    }
}

simulatePing();
</script>

</body>
</html>
